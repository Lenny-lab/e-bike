<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>封面</title>
  <style>
    body {
      width: 1200px; height: 900px;
      background: #FAF7F2;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      padding: 60px;
      font-family: Georgia, 'Times New Roman', serif;
      position: relative;
    }
    .cover-kicker {
      font-size: 10px; letter-spacing: 0.5em;
      text-transform: uppercase; color: #B07D2A;
      margin-bottom: 25px;
    }
    .cover-title {
      font-size: 52px; font-style: italic; font-weight: 600;
      color: #14213D; text-align: center; line-height: 1.4;
      margin-bottom: 35px; max-width: 850px;
    }
    .cover-title em { color: #B07D2A; font-weight: 700; }
    .cover-illustration { margin: 15px 0 25px; }
    .cover-line { width: 80px; height: 2px; background: #B07D2A; margin-bottom: 35px; }
    .cover-team { font-size: 20px; font-style: italic; color: #4a4a4a; margin-bottom: 40px; }
    .cover-byline {
      font-family: sans-serif; font-size: 10px; color: #6a6a6a;
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 8px 20px; max-width: 800px; margin-bottom: 15px;
    }
    .cover-byline strong { color: #14213D; margin-right: 6px; font-weight: 500; }
    .cover-sep { color: #ccc; }
    .cover-mentors {
      font-family: sans-serif; font-size: 10px; color: #8a8a8a;
      text-align: center; padding-top: 12px;
      border-top: 1px solid rgba(200,200,200,0.5);
    }
    .cover-mentors strong { color: #14213D; margin-right: 6px; font-weight: 500; }
    .cover-footer {
      position: absolute; bottom: 30px;
      font-family: monospace; font-size: 9px;
      color: #B07D2A; letter-spacing: 0.2em;
    }
    @media print { body { width: 100%; height: 100%; } @page { size: 1200px 900px; margin: 0; } }
  </style>
</head>
