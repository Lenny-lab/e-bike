<!doctype html><meta charset="utf-8"><title>audit</title><iframe id="f" src="/index.html" style="width:390px;height:900px;border:0"></iframe><pre id="r">loading</pre><script>
const done=()=>{const f=document.getElementById('f');const d=f.contentDocument;const ids=['reverseIntro','identityCards','identityJourney','chartDestinationMatrix','chartCompetition','explodedScooter'];const res={};ids.forEach(id=>{const el=d.getElementById(id);res[id]=!!el;res[id+'Text']=el?el.innerText.slice(0,120):'';res[id+'Canvas']=el?!!el.querySelector('canvas'):false;});res.qmarks=d.body.innerText.split('?').length-1;res.vw=f.contentWindow.innerWidth;res.docW=d.documentElement.scrollWidth;res.bodyW=d.body.scrollWidth;res.overflow=res.docW>res.vw+2||res.bodyW>res.vw+2;document.getElementById('r').textContent=JSON.stringify(res,null,2)};document.getElementById('f').onload=()=>setTimeout(done,4000);setTimeout(done,7000);</script>
