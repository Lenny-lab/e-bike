<!doctype html><meta charset="utf-8"><iframe id="f" src="/index.html" style="width:390px;height:1100px;border:0"></iframe><pre id="r">loading</pre><script>
function geom(d,sel){const el=d.querySelector(sel);if(!el)return null;const b=el.getBoundingClientRect();return {x:Math.round(b.x),y:Math.round(b.y),w:Math.round(b.width),h:Math.round(b.height),text:(el.innerText||'').slice(0,80)}}
const done=()=>{const f=document.getElementById('f');const w=f.contentWindow;const d=f.contentDocument;const ids=['reverseIntro','identityCards','identityJourney','chartDestinationMatrix','chartCompetition','explodedScooter'];const res={vw:w.innerWidth,docW:d.documentElement.scrollWidth,bodyW:d.body.scrollWidth,qmarks:(d.body.innerText.match(/\?/g)||[]).length,overflow:false,ids:{},boxes:{}};res.overflow=res.docW>res.vw+2||res.bodyW>res.vw+2;ids.forEach(id=>{const el=d.getElementById(id);res.ids[id]=!!el;res.boxes[id]=geom(d,'#'+id);res.ids[id+'Canvas']=el?!!el.querySelector('canvas'):false});try{const chart=w.echarts.getInstanceByDom(d.getElementById('chartCompetition'));const opt=chart.getOption();res.competitionGraphic=(opt.graphic||[]).map(g=>g.style&&g.style.text).filter(Boolean).slice(0,6);res.competitionSeries=opt.series&&opt.series[0]&&opt.series[0].data?opt.series[0].data.slice(0,3).map(x=>x.name+':'+x.value):[];}catch(e){res.competitionError=String(e)}try{const dm=w.echarts.getInstanceByDom(d.getElementById('chartDestinationMatrix'));const opt2=dm.getOption();res.matrixSeries=(opt2.series||[]).map(s=>({name:s.name,count:s.data?s.data.length:0}));}catch(e){res.matrixError=String(e)}document.getElementById('r').textContent=JSON.stringify(res,null,2)};document.getElementById('f').onload=()=>setTimeout(done,4500);setTimeout(done,8000);</script>
